 "file": "selected/candidate-09-v3.png", "before": "images/candidate-09.png", "history": [{"file": "_history/candidate-09-draft.png", "title": "초안", "description": "최초 디자인"}, {"file": "_history/candidate-09-before.png", "title": "수정 1", "description": "질감과 그래픽을 확장한 안"}, {"file": "images/candidate-09.png", "title": "수정 2", "description": "후보별 피드백 반영"}, {"file": "selected/candidate-09-v3.png", "title": "수정 3 · 현재", "description": "흰 배경·한글 표기·QR 안내 반영"}]}, {"number": "11", "name": "세로 자모 조형 · 개선안", "desc": "옅은 색감 · 가장자리까지 확장 · 자모 겹침", "color": "매년 글자와 겹침 색면의 색상 조합을 변경하는 구성", "file": "selected/candidate-11-v11.png", "before": "selected/candidate-11-v3.png", "history": [{"file": "_history/candidate-11-draft.png", "title": "초안", "description": "최초 디자인"}, {"file": "_history/candidate-11-before.png", "title": "수정 1", "description": "질감과 그래픽을 확장한 안"}, {"file": "images/candidate-11.png", "title": "수정 2", "description": "후보별 피드백 반영"}, {"file": "selected/candidate-11-korean-initial.png", "title": "수정 3", "description": "한글 전환 최초안 · 글자 형태 지적 전"}, {"file": "selected/candidate-11-v3.png", "title": "수정 4", "description": "한글 가독성을 강화한 안"}, {"file": "selected/candidate-11-v4.png", "title": "수정 5", "description": "도형처럼 보이는 타이포그래피 복원"}, {"file": "selected/candidate-11-v5.png", "title": "수정 6", "description": "정방향 디자인 선택 · 저자명 옆에 작은 지음 추가"}, {"file": "selected/candidate-11-v6.png", "title": "수정 7", "description": "외곽선 제거 · 글자 내부를 관통하는 가로·세로·사선 색면"}, {"file": "selected/candidate-11-v7.png", "title": "수정 8", "description": "자모를 원·직사각형으로 재구성 · 민트 자음과 살구 모음"}, {"file": "selected/candidate-11-v8.png", "title": "수정 9", "description": "자모 구조 유지 · 획과 원형의 반복선 및 겹침 면 복원"}, {"file": "selected/candidate-11-v10.png", "title": "수정 10", "description": "기존 세로 레이아웃 유지 · 새 자모의 형태·색·겹침 적용"}, {"file": "selected/candidate-11-v11.png", "title": "수정 11 · 현재 개선안", "description": "세로 배치 유지 · 옅은 민트·살구 · 확대와 가장자리 잘림 · 자모 겹침"}]}];const modal=document.getElementById('modal'),panes=document.getElementById('panes');let active=null,full=true;function renderHistory(){panes.replaceChildren();const stages=full?active.history:[active.history.at(-1)];panes.classList.toggle('single',!full);document.getElementById('compare').textContent=full?'현재만 보기':'전체 수정 이력';document.getElementById('history-note').textContent=full?'전체 '+active.history.length+'단계 · 초안부터 최신순 · 이미지를 누르면 원본 확대':'최신 수정본 · 이미지를 누르면 원본 확대';stages.forEach(s=>{const f=document.createElement('figure'),cap=document.createElement('figcaption'),small=document.createElement('small'),a=document.createElement('a'),im=document.createElement('img');cap.textContent=s.title;small.textContent=s.description;cap.append(small);im.src=s.file;im.alt='후보 '+active.number+' '+s.title;im.loading='lazy';a.href=s.file;a.target='_blank';a.rel='noopener';a.append(im);f.append(cap,a);panes.append(f)})}function openItem(x){active=x;full=true;document.getElementById('title').textContent='후보 '+x.number+' · '+x.name;renderHistory();modal.showModal();modal.scrollTop=0}items.forEach(x=>{const a=document.createElement('article');a.className='card';a.innerHTML='<h2>후보 '+x.number+' · '+x.name+'</h2><button class="cover" aria-label="후보 '+x.number+' 전체 수정 이력"><img src="'+x.file+'" alt="후보 '+x.number+' 최신 표지"></button><p class="desc">'+x.desc+'</p><p class="desc">'+x.color+'</p><div class="actions"><button class="history">전체 수정 이력 · '+x.history.length+'단계</button><a class="link" download href="'+x.file+'">최신 이미지 저장</a></div>';a.querySelector('.cover').onclick=()=>openItem(x);a.querySelector('.history').onclick=()=>openItem(x);document.getElementById('grid').append(a)});document.getElementById('close').onclick=()=>modal.close();document.getElementById('compare').onclick=()=>{full=!full;renderHistory()};</script></html>
