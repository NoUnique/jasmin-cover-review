<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta property="og:title" content="쎄뇨라유 스페인어 · 선택 표지 3종"><meta property="og:description" content="후보 01 · 09 · 11 — 요청사항 반영 시안"><title>쎄뇨라유 스페인어 · 선택 표지 3종</title><style>
*{box-sizing:border-box}body{margin:0;background:#f0efeb;color:#142f3b;font-family:Arial,sans-serif}header,nav,main,footer{max-width:1440px;margin:auto;padding:24px}header{padding-top:45px}h1{font-size:34px;margin:12px 0}p{line-height:1.7}nav{display:flex;gap:12px;flex-wrap:wrap}button,a{font:inherit}button,.link{display:inline-block;text-decoration:none;border:1px solid #a7b4b9;border-radius:6px;background:white;color:inherit;padding:12px 18px;cursor:pointer}.primary{background:#173b47;color:white;border-color:#173b47}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px}.cover{display:block;padding:0;border:0;width:100%;background:transparent}.cover img{display:block;width:100%;aspect-ratio:1054/1492;object-fit:contain;background:white;box-shadow:0 4px 18px #152e3b12}.label{font-size:15px;letter-spacing:.06em}.card h2{font-size:25px}.desc{font-size:15px;margin:8px 0;color:#536870}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.actions a{color:inherit}footer{font-size:14px;color:#67757a}dialog{width:96vw;max-width:1300px;max-height:95vh;border:0;background:#f4f3ef;padding:24px}dialog::backdrop{background:#000b}.head{display:flex;align-items:center;justify-content:space-between;gap:15px}.panes{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panes.single{display:block;max-width:620px;margin:auto}.panes.single figure:first-child{display:none}figure{margin:0}figure img{width:100%}figcaption{padding:14px 0;font-weight:bold}@media(max-width:750px){.grid{grid-template-columns:1fr;gap:40px}main,header,nav,footer{padding:20px}header{padding-top:30px}h1{font-size:28px}.panes{grid-template-columns:1fr}.card{max-width:520px;margin:auto;width:100%}.head{align-items:flex-start}}
</style><header><div class="label">쎄뇨라유 스페인어</div><h1>선택 표지 3종</h1><p>후보 01 · 09 · 11에 요청사항을 반영했습니다.<br>흰 배경 · ‘파이널’ 한글 표기 · 한글 브랜드 · QR 문제해설강의 포함</p></header><nav><a class="link primary" href="selected-candidates.zip">선택 후보 이미지 받기</a><a class="link" href="previous-candidates.html">기존 후보 보기 · 15종 및 수정 이력</a></nav><main><div class="grid" id="grid"></div></main><footer>2027학년도 표기를 유지했습니다. 각 디자인은 매년 그래픽의 색상을 바꿔 이어가는 구성을 전제로 합니다.</footer><dialog id="modal"><div class="head"><h2 id="title"></h2><div><button id="compare">수정 전후 비교</button> <button id="close">닫기 ✕</button></div></div><div class="panes single" id="panes"><figure><figcaption>수정 전</figcaption><img id="before" alt="수정 전"></figure><figure><figcaption>요청사항 반영</figcaption><img id="after" alt="요청사항 반영"></figure></div></dialog><script>
const items=[{"number": "01", "name": "곡선 띠", "desc": "흰 배경 · 청록색 곡선 띠 · 한글 브랜드", "color": "매년 곡선 띠 색상을 변경하는 구성", "file": "selected/candidate-01-v3.png", "before": "images/candidate-01.png"}, {"number": "09", "name": "리본과 명조", "desc": "한글 파이널 · 반투명 리본 · 흰 배경", "color": "매년 리본의 두 색상 조합을 변경하는 구성", "file": "selected/candidate-09-v3.png", "before": "images/candidate-09.png"}, {"number": "11", "name": "겹침 타이포그래피", "desc": "한글 파이널 그래픽 · 반투명 색면 · 흰 배경", "color": "매년 글자와 겹침 색면의 색상 조합을 변경하는 구성", "file": "selected/candidate-11-v3.png", "before": "images/candidate-11.png"}];const modal=document.getElementById('modal'),panes=document.getElementById('panes');function openItem(x,compare){document.getElementById('title').textContent='후보 '+x.number+' · '+x.name;document.getElementById('before').src=x.before;document.getElementById('after').src=x.file;panes.classList.toggle('single',!compare);document.getElementById('compare').textContent=compare?'현재만 보기':'수정 전후 비교';modal.showModal()};items.forEach(x=>{const a=document.createElement('article');a.className='card';a.innerHTML='<h2>후보 '+x.number+' · '+x.name+'</h2><button class="cover" aria-label="후보 '+x.number+' 확대"><img src="'+x.file+'" alt="후보 '+x.number+' 요청사항 반영 표지"></button><p class="desc">'+x.desc+'</p><p class="desc">'+x.color+'</p><div class="actions"><button class="history">수정 전후 비교</button><a class="link" download href="'+x.file+'">이미지 저장</a></div>';a.querySelector('.cover').onclick=()=>openItem(x,false);a.querySelector('.history').onclick=()=>openItem(x,true);document.getElementById('grid').append(a)});document.getElementById('close').onclick=()=>modal.close();document.getElementById('compare').onclick=()=>{panes.classList.toggle('single');document.getElementById('compare').textContent=panes.classList.contains('single')?'수정 전후 비교':'현재만 보기'};</script></html>
