n();[['draft','초안'],['before','수정 전'],['file','수정 2']].forEach(([key,label])=>{let f=document.createElement('figure'),c=document.createElement('figcaption'),sm=document.createElement('small'),img=document.createElement('img');c.textContent=label;sm.textContent=note(x,key);c.append(sm);img.src=x[key];img.alt=x.title+' '+label;f.append(c,img);panes.append(f)});modal.showModal()};grid.append(b)})}document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{stage=b.dataset.stage;document.querySelectorAll('[data-stage]').forEach(c=>c.classList.toggle('active',c===b));draw()});document.getElementById('close').onclick=()=>modal.close();draw();</script></html>
